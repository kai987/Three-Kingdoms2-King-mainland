name: Shared Web campaign verification
on:
  workflow_call:
    outputs:
      verified_attempt:
        description: Attempt that recorded the verified Web candidate
        value: ${{ jobs.gate.outputs.verified_attempt }}
    inputs:
      batch_enabled:
        type: boolean
        required: true
permissions:
  contents: read
  actions: read
  deployments: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  RUSTUP_TOOLCHAIN: '1.93.0'
  AB_SOURCE: 'a24bf1ad11e41ba31b7d3709f34f2ba7c5b46440'
  AB_TREE: '521559f972e74e75fb53046891ec9b426c1fed28'
  AB_ARTIFACT_HEAD: 'b527c81f59f496baa1a1711b74d85f8863e6e740'
  AB_RUN: '45047630871'
  AB_NATIVE_ID: '14764077282'
  AB_NATIVE_ZIP_SHA: 'e0180621dc02e948205e7a1fb79fa642967ab92952f97e084b6e783497a9dc48'
  AB_NATIVE_TAR_SHA: '46e2291d10105605333919c57848facc450c7ce664abf5e6cace7c44eee5fad5'
  AB_NATIVE_LIBRARY_SHA: '1bec230db405d6fb3a5effe1518a32467da4eabaa682f88cc66df2b22acf5f90'
  AB_WEB_ID: '14763802838'
  AB_WEB_SHA: '7bab66945f03f8ea8226dd7e6f6d5d3e68e9801e5ac753f36184463e317fa6d5'
  AB_WEB_CONTENT: 'a45f91de8f239041f9d360e102aebb9c1f24e2b355462ffbecfe9dec0d66c17a'
  AB_BATCH: ${{ inputs.batch_enabled && 'on' || 'off' }}
  AB_PYTHON_RUNNER: |
    import os
    from pathlib import Path
    import runpy
    import sys
    import unittest

    sys.path.insert(0, str(Path.cwd() / 'source'))
    from remake import restore_routes

    mode = os.environ['AB_BATCH']
    assert mode in ('on', 'off')
    script, *args = sys.argv[1:]
    sys.argv = [script, *args]
    prepare = restore_routes._prepare
    test_run = unittest.TestCase.run
    contract_tests = {
        'test_remake_hazard_marches.HazardMarchTests.test_restore_batches_active_and_historical_legs_and_rejects_edits',
        'test_remake_hazard_marches.HazardMarchTests.test_restore_with_older_native_library_keeps_scalar_checks',
    }
    force_contract = False
    counts = {'workload': 0, 'contract': 0}

    def measured_prepare(data, state):
        if mode == 'off' and not force_contract:
            return None
        result = prepare(data, state)
        if result is not None:
            counts['contract' if force_contract else 'workload'] += 1
        return result

    def measured_test(test, result=None):
        global force_contract
        previous, before = force_contract, counts['workload']
        test_id = test.id()
        force_contract = test_id in contract_tests
        try:
            return test_run(test, result)
        finally:
            force_contract = previous
            if test_id.startswith('test_remake_delegation_replay.') and (
                    '.test_217_' in test_id or '.test_263_' in test_id):
                batches = counts['workload'] - before
                print(f'AB_REPLAY {test_id} mode={mode} restore_batches={batches}', flush=True)
                if result is not None and result.wasSuccessful():
                    assert (batches > 0) == (mode == 'on')

    restore_routes._prepare = measured_prepare
    unittest.TestCase.run = measured_test
    print(f'AB_BATCH {mode}', flush=True)
    try:
        runpy.run_path(script, run_name='__main__')
    finally:
        print(f'AB_RESTORE_COUNTS {mode} {counts}', flush=True)
        assert mode != 'off' or counts['workload'] == 0
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      full: ${{ steps.plan.outputs.full }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
      web: ${{ steps.plan.outputs.web }}
      native: ${{ steps.plan.outputs.native }}
      rules: ${{ steps.plan.outputs.rules }}
      soak: ${{ steps.plan.outputs.soak }}
      resupply: ${{ steps.plan.outputs.resupply }}
      publish: ${{ steps.plan.outputs.publish }}
      reuse: ${{ steps.plan.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: /tools/ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Load the original #66 full test plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '14764042191'
          path: build/ci
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Require the verified source, plan and artifact identities
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AB_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$AB_TREE"
          jq -e --arg head "$AB_ARTIFACT_HEAD" '.head == $head and .mode == "full" and .full and .native and .rules and .soak and .resupply and .web and (.publish | not) and (.pr_reuse == null)' build/ci/test-plan.json
          verify_input() {
            metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$1")
            printf '%s\n' "$metadata" | jq -c '{id,name,digest,expired,run:.workflow_run.id}'
            printf '%s\n' "$metadata" |
              jq -e --argjson run "$AB_RUN" --argjson id "$1" --arg name "$2" --arg digest "sha256:$3" \
                '.id == $id and .name == $name and .workflow_run.id == $run and (.expired | not) and .digest == $digest'
          }
          verify_input "$AB_NATIVE_ID" "native-reference-$AB_ARTIFACT_HEAD" "$AB_NATIVE_ZIP_SHA"
          verify_input "$AB_WEB_ID" "candidate-web-$AB_ARTIFACT_HEAD" "$AB_WEB_SHA"
          python -B tools/ci/gate.py outputs --plan build/ci/test-plan.json --head "$AB_ARTIFACT_HEAD" >> "$GITHUB_OUTPUT"
          python -B tools/ci/gate.py summary --plan build/ci/test-plan.json --head "$AB_ARTIFACT_HEAD" >> "$GITHUB_STEP_SUMMARY"
          printf 'AB_SOURCE %s\nAB_NATIVE %s %s\nAB_WEB %s %s\n' "$AB_SOURCE" "$AB_NATIVE_ID" "$AB_NATIVE_LIBRARY_SHA" "$AB_WEB_ID" "$AB_WEB_CONTENT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-plan-${{ github.sha }}
          path: build/ci/test-plan.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  docs-check:
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ github.sha }}
          path: build/ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Documentation whitespace and repository links
        run: python -B tools/ci/gate.py docs --plan build/ci/test-plan.json --head "$GITHUB_SHA"
  native-rules:
    needs: scope
    if: needs.scope.outputs.native == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/march-core/target
            build/march-core-target
          key: ${{ runner.os }}-march-rust-1.93.0-${{ hashFiles('crates/march-core/Cargo.lock') }}-${{ hashFiles('crates/march-core/**/*.rs', 'crates/march-core/Cargo.toml', 'game/build_march_core.py') }}
          restore-keys: ${{ runner.os }}-march-rust-1.93.0-${{ hashFiles('crates/march-core/Cargo.lock') }}-
      - name: Install pinned marching-core toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Rust rules and reproducible native/WASM build
        run: |
          cargo fmt --manifest-path crates/march-core/Cargo.toml --check
          cargo clippy --manifest-path crates/march-core/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/march-core/Cargo.toml --locked
          python game/build_march_core.py --check
          node tests/march_wasm_parity.cjs
  campaign-rules:
    needs: [scope, native-rules]
    if: needs.scope.outputs.rules == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # The longest measured module (the 217 and 263 office replays) starts shard 1.
    timeout-minutes: ${{ matrix.shard == 1 && 30 || 20 }}
    strategy:
      # Leave runner capacity for browser shards while the build finishes.
      max-parallel: 8
      fail-fast: false
      matrix:
        # Order by median job duration from 43587811813, 43589716807 and 43591423363.
        include:
          - {backend: python, shard: 1}
          - {backend: rust, shard: 1}
          - {backend: rust, shard: 3}
          - {backend: rust, shard: 6}
          - {backend: rust, shard: 5}
          - {backend: python, shard: 4}
          - {backend: rust, shard: 4}
          - {backend: python, shard: 2}
          - {backend: rust, shard: 2}
          - {backend: python, shard: 3}
          - {backend: python, shard: 5}
          - {backend: python, shard: 6}
    env:
      MARCH_CORE_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/web-runtime/package-lock.json
      - name: Install the pinned runtime so release-boundary tests cannot skip
        run: |
          npm ci --prefix tools/web-runtime --ignore-scripts
          test -f tools/web-runtime/node_modules/pyodide/package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.AB_NATIVE_ID }}
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Restore the exact #66 native reference
        run: |
          set -euo pipefail
          printf '%s  build/native-reference.tar\n' "$AB_NATIVE_TAR_SHA" | sha256sum -c -
          tar -xf build/native-reference.tar -C build
          printf '%s  build/march-core/libmarch_core.so\n' "$AB_NATIVE_LIBRARY_SHA" | sha256sum -c -
      - name: Campaign behavior with ${{ matrix.backend }} marching, shard ${{ matrix.shard }}/6
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: python -B -c "$AB_PYTHON_RUNNER" tools/ci/run_campaign_tests.py --shard "$TEST_SHARD" --shards 6 --timings build/ci/campaign-timings.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: campaign-timings-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/ci/campaign-timings.json
          if-no-files-found: ignore
          retention-days: 7
  campaign-soak-replay:
    needs: [scope, native-rules]
    if: needs.scope.outputs.soak == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # The full 144-turn Rust replay exceeded 20 minutes on the measured runner.
    # Keep every turn and seed; budget the complete replay instead of trimming it.
    timeout-minutes: 40
    strategy:
      # Leave runner capacity for browser shards while the build finishes.
      max-parallel: 4
      fail-fast: false
      matrix:
        include:
          - {case: early, seed: 3, backend: both}
          - {case: early, seed: 2026, backend: both}
          - {case: middle, seed: 3, backend: python}
          - {case: middle, seed: 3, backend: rust}
          - {case: middle, seed: 2026, backend: python}
          - {case: middle, seed: 2026, backend: rust}
          - {case: late, seed: 3, backend: both}
          - {case: late, seed: 2026, backend: both}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.AB_NATIVE_ID }}
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Restore the exact #66 native reference
        run: |
          set -euo pipefail
          printf '%s  build/native-reference.tar\n' "$AB_NATIVE_TAR_SHA" | sha256sum -c -
          tar -xf build/native-reference.tar -C build
          printf '%s  build/march-core/libmarch_core.so\n' "$AB_NATIVE_LIBRARY_SHA" | sha256sum -c -
      - name: Full-duration cross-year campaign execution
        env:
          SOAK_CASE: ${{ matrix.case }}
          SOAK_SEED: ${{ matrix.seed }}
          SOAK_BACKEND: ${{ matrix.backend }}
        run: python -B -c "$AB_PYTHON_RUNNER" tools/campaign-soak/ci.py fragment --case "$SOAK_CASE" --seed "$SOAK_SEED" --backend "$SOAK_BACKEND" --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output "build/soak-ci/${SOAK_CASE}-${SOAK_SEED}-${SOAK_BACKEND}.json" --progress
      - name: Retain replay diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campaign-soak-execution-${{ matrix.case }}-${{ matrix.seed }}-${{ matrix.backend }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/soak-ci
          if-no-files-found: ignore
          retention-days: 7
  campaign-soak:
    needs: [scope, campaign-soak-replay]
    if: always() && needs.scope.outputs.soak == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: campaign-soak-execution-*-${{ github.sha }}-attempt-${{ github.run_attempt }}
          merge-multiple: false
          path: build/soak-ci
      - name: Require every execution and exact Python/Rust state, save and RNG parity
        env:
          EXECUTION_RESULT: ${{ needs.campaign-soak-replay.result }}
        run: python -B tools/campaign-soak/ci.py merge --input-dir build/soak-ci --execution-result "$EXECUTION_RESULT" --head "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --output build/soak/merged.json
      - name: Retain mandatory parity gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: campaign-soak-parity-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/soak
          if-no-files-found: ignore
          retention-days: 7
  source-and-browser:
    needs: scope
    if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARCH_CORE_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/portraits/requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/cloud-sdk/package-lock.json
      - name: Current campaign and source builds
        run: |
          python tools/officer-placement/import_campaign_stats.py --check
          python game/build_campaigns.py --check
          python game/build_terrain_art.py --check
          python tools/officer-placement/audit_campaign_stats.py --check
          python tools/scenario-history/audit.py --check
          python tools/scenario-history/ruler_audit.py --check
          python tools/scenario-history/retainer_audit.py --check
          python tools/officer-placement/build_original_equipment.py --check
          python tools/officer-placement/import_original_stats.py --check
          python game/build_map_anchors.py
          python game/build_map_presentation.py
          python game/build_message_locales.py
          python game/build_locales.py
          git diff --exit-code -- game/data game/assets game/locales
      - name: Browser scripts and interaction checks
        run: |
          for file in game/*.js; do node --check "$file"; done
          for file in tests/test_remake_*.cjs; do node "$file"; done
      - name: Pinned self-hosted cloud SDK
        run: |
          npm ci --prefix tools/cloud-sdk --ignore-scripts
          npm run check --prefix tools/cloud-sdk
      - name: Original battle pixels and stable-ID portrait assets
        run: |
          python -m pip install -r tools/portraits/requirements.txt
          python tools/portraits/build_generated.py --check
          python game/build_portrait_manifest.py --check
          python tools/battle-original/build.py --check
          python tools/battlefields/build.py --check
          node tools/civil-portraits/build.cjs --check
          node tools/battle-enhancement/build.cjs --check
      - name: Offline source collector tests and whitespace
        run: |
          python -m unittest discover -s tools/officer-placement -p 'test_*.py' -v
          git diff --check
  scoped-tests:
    needs: [scope, native-rules]
    if: >-
      always() && !cancelled() && needs.scope.result == 'success' &&
      needs.scope.outputs.reuse != 'true' &&
      needs.scope.outputs.mode == 'scoped' &&
      (needs.scope.outputs.native != 'true' || needs.native-rules.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [modules-1, modules-2, catalogs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.lane != 'catalogs'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/web-runtime/package-lock.json
      - name: Install pinned runtime for the selected release-boundary tests
        if: matrix.lane != 'catalogs'
        run: npm ci --prefix tools/web-runtime --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ github.sha }}
          path: build/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.scope.outputs.native == 'true'
        with:
          artifact-ids: ${{ env.AB_NATIVE_ID }}
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Restore the same native reference
        if: needs.scope.outputs.native == 'true'
        run: tar -xf build/native-reference.tar -C build
      - name: Run the selected module shard or catalog checks
        # Save compatibility and campaign smoke compare both real backends internally.
        env:
          SCOPED_LANE: ${{ matrix.lane }}
        run: python -B tools/ci/run_scoped_tests.py --plan build/ci/test-plan.json --backend python --lane "$SCOPED_LANE" --report build/ci/scoped-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scoped-report-${{ matrix.lane }}-${{ github.sha }}
          path: build/ci/scoped-report.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
  web-build:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      content_sha256: ${{ steps.identity.outputs.content_sha256 }}
      artifact_id: ${{ steps.identity.outputs.artifact_id }}
      archive_sha256: ${{ steps.identity.outputs.archive_sha256 }}
    env:
      MARCH_CORE_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/web-runtime/package-lock.json
      - run: npm ci --prefix tools/web-runtime --ignore-scripts
      - name: Rebuild and compare the #66 Web content digest
        id: identity
        run: |
          GITHUB_SHA="$AB_ARTIFACT_HEAD" python -B game/build_web.py --output build/web-rebuilt
          content=$(python -B tools/ci/gate.py artifact --root build/web-rebuilt --head "$AB_ARTIFACT_HEAD" --content-sha256 "$AB_WEB_CONTENT")
          printf 'content_sha256=%s\nartifact_id=%s\narchive_sha256=%s\n' "$content" "$AB_WEB_ID" "$AB_WEB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ env.AB_WEB_ID }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Actual WASM campaign and CPU replay parity
        run: |
          python -B tools/ci/gate.py artifact --root build/web --head "$AB_ARTIFACT_HEAD" --content-sha256 "$AB_WEB_CONTENT"
          node tests/browser_engine_smoke.mjs build/web
  browser-ui:
    needs: [scope, web-build]
    if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    # Allow for runner variability in the full touch suite with the expanded map.
    timeout-minutes: ${{ matrix.project == 'touch-chromium' && 40 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
        shard: [1, 2, 3]
    env:
      TK2_TEST_PLAN: build/ci/test-plan.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
          sparse-checkout: |
            /.gitignore
            /.github/actions/browser-tools/
            /tests/
            /tools/browser-tests/
            /tools/ci/
            /source/
            /game/config/
            /game/data/
            /game/assets/map-presentation.json
            /game/assets/battlefields/index.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ github.sha }}
          path: build/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.web-build.outputs.artifact_id }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Require the exact immutable candidate
        env:
          CONTENT_SHA: ${{ needs.web-build.outputs.content_sha256 }}
        run: python -B tools/ci/gate.py artifact --root build/web --head "$AB_ARTIFACT_HEAD" --content-sha256 "$CONTENT_SHA"
      - name: Show the selected scope and execute actual browser controls
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          node tools/browser-tests/scope.cjs --plan "$TK2_TEST_PLAN"
          node tools/browser-tests/verify-shards.mjs "$BROWSER_PROJECT"
          GITHUB_SHA="$AB_ARTIFACT_HEAD" node tools/browser-tests/run-shard.mjs "$BROWSER_PROJECT" "$BROWSER_SHARD"
      - name: Retain bounded per-case timing data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          # Stable per-commit names let a failed-job retry reuse the reports
          # from its unchanged successful sibling jobs.
          name: browser-timing-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.sha }}
          path: build/browser-timings/${{ matrix.project }}-shard-${{ matrix.shard }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-${{ matrix.project }}-shard-${{ matrix.shard }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            build/browser-results
            build/browser-report
          if-no-files-found: ignore
          retention-days: 7
  resupply-ui:
    needs: scope
    if: needs.scope.outputs.resupply == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - name: Segmented supply, courier rendezvous and physical return
        run: node tools/browser-tests/node_modules/@playwright/test/cli.js test --config tools/browser-tests/resupply.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resupply-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/resupply-browser-results
          if-no-files-found: ignore
          retention-days: 7
  gate:
    needs: [scope, docs-check, native-rules, source-and-browser, scoped-tests, campaign-rules, campaign-soak, web-build, browser-ui, resupply-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verified_attempt: ${{ steps.candidate.outputs.attempt }}
    env:
      FULL_GATE_SPARSE_PATHS: |
        /tools/ci/
        /tools/browser-tests/
        /tests/browser_ui.spec.mjs
        /tests/browser_soldier_ui.spec.mjs
        /game/data/campaigns/index.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.AB_SOURCE }}
          persist-credentials: false
          # Reuse needs only CI helpers. Full verification also reads browser coverage inputs.
          sparse-checkout: >-
            ${{ needs.scope.result == 'success' &&
                (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
                 needs.scope.outputs.reuse == 'true' && '/tools/ci/' ||
                 needs.scope.outputs.mode == 'full' && env.FULL_GATE_SPARSE_PATHS) || '' }}
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ github.sha }}
          path: build/ci
      - name: Fail if any required group failed, was cancelled or was skipped
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import os,pathlib;pathlib.Path("build/ci/needs.json").write_text(os.environ["JOB_RESULTS"])'
          python -B tools/ci/gate.py verify --plan build/ci/test-plan.json --needs build/ci/needs.json --head "$AB_ARTIFACT_HEAD"
          python -B tools/ci/gate.py summary --plan build/ci/test-plan.json --head "$AB_ARTIFACT_HEAD" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect scoped Python reports from this run
        if: needs.scope.outputs.mode == 'scoped' && needs.scope.outputs.reuse != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: scoped-report-*-${{ github.sha }}
          path: build/scoped-reports
      - name: Verify complete scoped module and catalog coverage
        if: needs.scope.outputs.mode == 'scoped' && needs.scope.outputs.reuse != 'true'
        run: python -B tools/ci/run_scoped_tests.py --plan build/ci/test-plan.json --backend python --verify-reports build/scoped-reports
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
        with:
          node-version: '24'
      - name: Collect the exact commit's browser timings
        if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: browser-timing-*-shard-*-${{ github.sha }}
          path: build/browser-timings
          merge-multiple: true
      - name: Verify complete timing coverage and report measured shard costs
        if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
        env:
          TK2_TEST_PLAN: build/ci/test-plan.json
        run: |
          node tools/browser-tests/aggregate-timings.mjs build/browser-timings --head "$AB_ARTIFACT_HEAD"
          cat build/browser-timings/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.scope.outputs.web == 'true' && needs.scope.outputs.reuse != 'true'
        with:
          name: browser-timing-summary-${{ github.sha }}
          path: build/browser-timings
          overwrite: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.scope.outputs.web == 'true'
        with:
          artifact-ids: ${{ needs.web-build.outputs.artifact_id }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.AB_RUN }}
          merge-multiple: true
      - name: Verify the original candidate after every required check passed
        id: candidate
        if: needs.scope.outputs.web == 'true'
        env:
          CANDIDATE_ID: ${{ needs.web-build.outputs.artifact_id }}
          CANDIDATE_ARCHIVE_SHA: ${{ needs.web-build.outputs.archive_sha256 }}
          CONTENT_SHA: ${{ needs.web-build.outputs.content_sha256 }}
        run: |
          python -B tools/ci/verified_web.py record --root build/web \
            --record build/ci/verified-candidate.json --head "$AB_ARTIFACT_HEAD" \
            --run-id "$AB_RUN" --attempt 1
          printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the verified candidate record
        if: needs.scope.outputs.web == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-candidate-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: build/ci/verified-candidate.json
          if-no-files-found: error
          retention-days: 7
      - name: Record the verified PR source tree and coverage
        if: github.event_name == 'pull_request' && needs.scope.outputs.web == 'true'
        run: python -B tools/ci/pr_reuse.py receipt --plan build/ci/test-plan.json --proof build/ci/receipt.json
      - name: Upload PR verification receipt
        if: github.event_name == 'pull_request' && needs.scope.outputs.web == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-proof-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: build/ci/receipt.json
          if-no-files-found: error
          retention-days: 7
