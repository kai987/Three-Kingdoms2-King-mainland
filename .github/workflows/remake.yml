name: Web campaign checks
run-name: ${ inputs.priority_pair != '' && format('Runner priority {0}', inputs.priority_pair) || 'Web campaign checks' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      priority_pair:
        description: Identifier shared by the two experimental dispatches
        type: string
        default: ''
      force_full:
        description: Run every regression group
        type: boolean
        default: true
  schedule:
    # Daily full regression at 03:00 Japan time; verification only.
    - cron: '0 18 * * *'

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || 'changes' }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.priority_pair == ''
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_full) }}
  verify-priority:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.priority_pair != '' &&
      (github.ref == 'refs/heads/codex/ci-runner-priority-a' || github.ref == 'refs/heads/codex/ci-runner-priority-b')
    uses: ./.github/workflows/web-checks-priority.yml
    with:
      force_full: true
      pair: ${ inputs.priority_pair }}
