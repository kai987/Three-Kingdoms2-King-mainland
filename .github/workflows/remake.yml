name: Web campaign checks

on:
  workflow_dispatch:
    inputs:
      reserve_browser_capacity:
        description: Limit the parallel backend jobs while comparing browser queue time
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: web-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || github.event_name == 'workflow_dispatch' && 'manual' || 'changes' }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      reserve_browser_capacity: ${{ inputs.reserve_browser_capacity }}
