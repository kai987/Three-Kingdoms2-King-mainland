name: Web campaign checks
run-name: Full CI A/B - ${{ inputs.variant }}

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Workflow and test harness variant
        type: choice
        options: [baseline, optimized]
        default: baseline
      candidate_run:
        description: Baseline run supplying the byte-identical browser candidate
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  verify:
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      optimize_tail: ${{ inputs.variant == 'optimized' }}
      candidate_run: ${{ inputs.candidate_run }}
