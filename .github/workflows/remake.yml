name: Web campaign checks
run-name: ${{ inputs.legacy_battle && 'Full CI with PR 37 battle tests' || 'Full CI with current battle tests' }}

on:
  workflow_dispatch:
    inputs:
      legacy_battle:
        description: Use the battle tests from before PR 41
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: web-checks-${{ github.ref }}-manual
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-battle-full-ab'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      legacy_battle: ${{ inputs.legacy_battle }}
