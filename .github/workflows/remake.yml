name: PR 51 allocation close return comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  OPTIMIZED_TEST: a2fd996e8076297da1456ad9038e52d481da3e26
  FROZEN_SOURCE: e111fe57fb1d8fcf5402b1a214713fe899813fe0
  FROZEN_TREE: 70f6679607274d89c45d070d627dd802298cc31f
  FROZEN_WEB_CONTENT: 92f0e55555bb1c4d29159e04c0b5160b68d9f41012e570eba88412ffed0a5005
  SOURCE_RUN: '43871312515'
  SOURCE_ARTIFACT: '14228481595'
  TK2_TEST_PLAN: build/ci/test-plan.json

jobs:
  profile:
    if: github.ref == 'refs/heads/codex/ci-allocation-close-ab'
    name: Compare allocation close on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Use the original source and isolate profiling scripts
        run: |
          test "$(git rev-parse HEAD^)" = "$OPTIMIZED_TEST"
          test "$(git rev-parse HEAD^^)" = "$FROZEN_SOURCE"
          test "$(git diff --name-only "$FROZEN_SOURCE" "$OPTIMIZED_TEST")" = tests/browser_ui.spec.mjs
          git diff --exit-code "$OPTIMIZED_TEST" HEAD -- . ':!.github/workflows/remake.yml' ':!.github/experiments/allocation-profile'
          cp -R .github/experiments/allocation-profile "$RUNNER_TEMP/"
          git diff --binary "$FROZEN_SOURCE" "$OPTIMIZED_TEST" -- tests/browser_ui.spec.mjs > "$RUNNER_TEMP/allocation-profile/optimized.patch"
          git rev-parse "$OPTIMIZED_TEST:tests/browser_ui.spec.mjs" > "$RUNNER_TEMP/allocation-profile/optimized-test-blob"
          git switch --detach "$FROZEN_SOURCE"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - name: Confirm the original PR 51 Web artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" \
            --jq '[.id,.name,.workflow_run.id,.digest,.expired]|@tsv' > "$RUNNER_TEMP/artifact.tsv"
          test "$(cut -f1 "$RUNNER_TEMP/artifact.tsv")" = "$SOURCE_ARTIFACT"
          test "$(cut -f2 "$RUNNER_TEMP/artifact.tsv")" = "candidate-web-$FROZEN_SOURCE"
          test "$(cut -f3 "$RUNNER_TEMP/artifact.tsv")" = "$SOURCE_RUN"
          test "$(cut -f4 "$RUNNER_TEMP/artifact.tsv")" = 'sha256:9bb740698d1f7c0bde217bdee4c5d9e7ff9b3ffbd1e04c525ac59eee20497341'
          test "$(cut -f5 "$RUNNER_TEMP/artifact.tsv")" = false
          cat "$RUNNER_TEMP/artifact.tsv"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-web-${{ env.FROZEN_SOURCE }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ env.FROZEN_SOURCE }}
          path: build/ci
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify frozen Web content
        run: python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
      - name: Run desktop baseline
        run: bash "$RUNNER_TEMP/allocation-profile/run.sh" desktop-chromium baseline
      - name: Run desktop optimized
        run: bash "$RUNNER_TEMP/allocation-profile/run.sh" desktop-chromium optimized
      - name: Run touch optimized
        run: bash "$RUNNER_TEMP/allocation-profile/run.sh" touch-chromium optimized
      - name: Run touch baseline
        run: bash "$RUNNER_TEMP/allocation-profile/run.sh" touch-chromium baseline
      - name: Verify Web content after all four invocations
        run: python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
      - name: Retain read timings and original assertion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-close-ab-${{ github.run_attempt }}
          path: build/allocation-profile
          if-no-files-found: warn
