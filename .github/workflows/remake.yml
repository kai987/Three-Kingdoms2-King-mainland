name: Desktop shard runner profile
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repeated:
    if: github.ref == 'refs/heads/codex/ci-desktop1-runner-profile'
    uses: ./.github/workflows/desktop-profile.yml
    with:
      runner-label: first
  comparison:
    needs: repeated
    if: ${{ !cancelled() && github.ref == 'refs/heads/codex/ci-desktop1-runner-profile' }}
    strategy:
      fail-fast: false
      matrix:
        runner-label: [compare-a, compare-b, compare-c]
    uses: ./.github/workflows/desktop-profile.yml
    with:
      runner-label: ${{ matrix.runner-label }}
