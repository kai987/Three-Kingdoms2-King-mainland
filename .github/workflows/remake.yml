name: Browser sparse checkout full CI experiment
run-name: Browser checkout experiment (${{ inputs.checkout_mode }})

on:
  workflow_dispatch:
    inputs:
      checkout_mode:
        description: Checkout used by the six browser shards
        type: choice
        required: true
        options: [full, sparse]
        default: full

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: browser-checkout-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-browser-sparse-checkout-ab'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      checkout_mode: ${{ inputs.checkout_mode }}
