name: Web campaign checks
run-name: ${{ inputs.trial }} equipment full CI (${{ inputs.optimized && 'PR 57' || 'main' }})

on:
  workflow_dispatch:
    inputs:
      trial:
        description: A/B trial label
        type: string
        required: true
      optimized:
        description: Use the PR 57 equipment test
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: web-checks-${{ github.ref }}-manual
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-equipment-full-ab'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      equipment_optimized: ${{ inputs.optimized }}
