name: Web campaign checks
run-name: Web artifact experiment (${{ inputs.variant }})

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Full baseline, full single-artifact gate, or PR receipt reuse
        required: true
        type: choice
        options: [baseline, single-artifact, reuse]

permissions:
  contents: read
  actions: read
  deployments: read

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-gate-single-web-artifact'
    uses: ./.github/workflows/web-checks.yml
    with:
      variant: ${{ inputs.variant }}
