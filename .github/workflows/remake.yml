name: PR 56 equipment API profiling

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FROZEN_SOURCE: d304bf7a3b667bf355c9508b2ce77df5ec7f4310
  FROZEN_TREE: 0fa13e24aaed7849810cfd172976938b962d2eab
  FROZEN_WEB_CONTENT: 703c9a17a610e6bbae3daa5500b2cb334887cee8061caf43888c73f24014c063
  SOURCE_RUN: '44027608181'
  SOURCE_ARTIFACT: '14304236292'

jobs:
  profile:
    if: github.ref == 'refs/heads/codex/ci-equipment-read-profile'
    name: Measure equipment on desktop and touch on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Freeze release source and isolate profiling files
        run: |
          test "$(git rev-parse HEAD^)" = "$FROZEN_SOURCE"
          git diff --exit-code "$FROZEN_SOURCE" HEAD -- . ':!.github/workflows/remake.yml' ':!.github/experiments/equipment-read-profile'
          cp -R .github/experiments/equipment-read-profile "$RUNNER_TEMP/"
          git switch --detach "$FROZEN_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - name: Verify the identity of the original PR 56 Web archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" \
            --jq '[.id,.name,.workflow_run.id,.digest,.expired]|@tsv' > "$RUNNER_TEMP/artifact.tsv"
          test "$(cut -f1 "$RUNNER_TEMP/artifact.tsv")" = "$SOURCE_ARTIFACT"
          test "$(cut -f2 "$RUNNER_TEMP/artifact.tsv")" = "verified-web-$FROZEN_SOURCE"
          test "$(cut -f3 "$RUNNER_TEMP/artifact.tsv")" = "$SOURCE_RUN"
          test "$(cut -f4 "$RUNNER_TEMP/artifact.tsv")" = 'sha256:e4ee0fdd45a919cec7bb584235bb25e64451bfdd73110aa03d9eb6dc120cd0d3'
          test "$(cut -f5 "$RUNNER_TEMP/artifact.tsv")" = false
          cat "$RUNNER_TEMP/artifact.tsv"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-web-${{ env.FROZEN_SOURCE }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify the frozen Web release before profiling
        run: python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
      - name: Profile equipment on desktop
        run: bash "$RUNNER_TEMP/equipment-read-profile/run.sh" desktop-chromium
      - name: Profile equipment on touch
        run: bash "$RUNNER_TEMP/equipment-read-profile/run.sh" touch-chromium
      - name: Verify both equipment reports and the frozen release
        run: |
          test -z "$(git status --porcelain)"
          python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
          python -B "$RUNNER_TEMP/equipment-read-profile/report.py" build/equipment-read-profile | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain profiles and original Playwright test outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: equipment-read-profile-${{ github.run_attempt }}
          path: build/equipment-read-profile
          if-no-files-found: warn
