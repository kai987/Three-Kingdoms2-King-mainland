name: Web campaign checks

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  RELEASE_SHA: 9ecee364d788db1efcf3e6f5d5c83af25c01eecb
  BASE_SHA: 107e823813015ad036b3baaa16699c89dd23339b
  RELEASE_RUN: '43583939170'
  PR_RUN: '43581448333'
  CONTENT_SHA: b925b1018839f214fb46417e62974503d0b0672baa44a3a2defd933ef1795638

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-plan-${{ env.RELEASE_SHA }}
          path: inputs
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN }}
      - name: Find the original verified PR attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          python - <<'PY'
          import json, os
          from pathlib import Path

          folder = Path('inputs')
          plan = json.loads((folder / 'test-plan.json').read_text())
          original = plan.pop('pr_reuse')
          assert original['run_id'] == int(os.environ['PR_RUN'])
          assert original['number'] == 33 and original['attempt'] == 1
          (folder / 'replayed-plan.json').write_text(json.dumps(plan))
          event = {'ref': 'refs/heads/main', 'after': os.environ['RELEASE_SHA'],
                   'before': os.environ['BASE_SHA'], 'forced': False}
          (folder / 'push.json').write_text(json.dumps(event))
          PY
          GITHUB_SHA="$RELEASE_SHA" GITHUB_EVENT_PATH="$PWD/inputs/push.json" python -B tools/ci/pr_reuse.py find --plan inputs/replayed-plan.json --candidate inputs/pr-candidate.json
          test -s inputs/pr-candidate.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-proof-${{ env.PR_RUN }}-attempt-1
          path: inputs
          github-token: ${{ github.token }}
          run-id: ${{ env.PR_RUN }}
      - name: Replay production receipt verification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITHUB_SHA="$RELEASE_SHA" python -B tools/ci/pr_reuse.py decide --plan inputs/replayed-plan.json --candidate inputs/pr-candidate.json --proof inputs/receipt.json
          cmp <(jq -Sc . inputs/test-plan.json) <(jq -Sc . inputs/replayed-plan.json)
          python -B tools/ci/gate.py outputs --plan inputs/replayed-plan.json --head "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN/jobs?per_page=100" > inputs/jobs.json
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, 'tools/ci')
          from gate import JOBS, verify_jobs

          folder = Path('inputs')
          jobs = json.loads((folder / 'jobs.json').read_text())['jobs']
          names = {'verify / ' + name: name for name in ('scope', *JOBS)}
          needs = {names[job['name']]: {'result': job['conclusion']}
                   for job in jobs if job['name'] in names}
          verify_jobs(json.loads((folder / 'replayed-plan.json').read_text()), needs)
          (folder / 'needs.json').write_text(json.dumps(needs))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replayed-gate-inputs
          path: |
            inputs/replayed-plan.json
            inputs/needs.json
          if-no-files-found: error
          retention-days: 7

  gate:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
        variant: [full, sparse]
    env:
      VARIANT: ${{ matrix.variant }}
      SAMPLE: ${{ matrix.sample }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
          sparse-checkout: >-
            ${{ matrix.variant == 'sparse' &&
                needs.scope.result == 'success' && needs.scope.outputs.reuse == 'true' && '/tools/ci/' || '' }}
          sparse-checkout-cone-mode: false
      - name: Require the intended source checkout
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f tools/ci/gate.py
          if [[ "$VARIANT" == sparse ]]; then
            test "$(git sparse-checkout list)" = /tools/ci/
            test -z "$(git ls-files -t | awk '$1 != "S" && $2 !~ /^tools\/ci\//')"
            test ! -e game
          else
            test -f game/build_web.py
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: replayed-gate-inputs
          path: build/ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-web-${{ env.RELEASE_SHA }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.RELEASE_RUN }}
      - name: Verify reused scope and every file in the same release
        run: |
          python -B tools/ci/gate.py verify --plan build/ci/replayed-plan.json --needs build/ci/needs.json --head "$RELEASE_SHA"
          python -B tools/ci/gate.py summary --plan build/ci/replayed-plan.json > build/ci/gate-summary.md
          got=$(python -B tools/ci/gate.py artifact --root build/web --head "$RELEASE_SHA" --content-sha256 "$CONTENT_SHA")
          test "$got" = "$CONTENT_SHA"
          jq -ne --arg head "$RELEASE_SHA" --arg content "$got" --arg variant "$VARIANT" --arg sample "$SAMPLE" \
            --slurpfile plan build/ci/replayed-plan.json --slurpfile build build/web/runtime/build.json \
            '{head:$head, content_sha256:$content, variant:$variant, sample:($sample|tonumber),
              receipt:$plan[0].pr_reuse, files:($build[0].files|length)}' > build/ci/verified.json
          cat build/ci/gate-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm publication verification rejects a changed file
        if: matrix.sample == 1
        run: |
          printf '\nverification negative control\n' >> build/web/index.html
          if python -B tools/ci/gate.py artifact --root build/web --head "$RELEASE_SHA" --content-sha256 "$CONTENT_SHA" > build/ci/rejection.log 2>&1; then
            exit 1
          fi
          grep -F 'Release file changed: index.html' build/ci/rejection.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-evidence-${{ matrix.variant }}-${{ matrix.sample }}
          path: |
            build/ci/verified.json
            build/ci/gate-summary.md
          if-no-files-found: error
          retention-days: 30
