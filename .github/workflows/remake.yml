name: Web campaign checks
run-name: ${{ inputs.parallel_wasm && 'Full CI with parallel WASM parity' || 'Full CI with serial WASM parity' }}
on:
  workflow_dispatch:
    inputs:
      parallel_wasm:
        description: Release browser and WASM checks together after the candidate is ready
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: web-wasm-overlap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-wasm-overlap'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      parallel_wasm: ${{ inputs.parallel_wasm }}
