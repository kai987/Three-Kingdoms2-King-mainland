name: Web campaign checks
run-name: Battle browser phase timeline A/B on one runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  battle-step-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SOURCE_SHA: a67c5e2dbdb2a3843bb2a1a9de29eee8e18f1a7a
      RESPONSE_SHA: 4e8159cff1c8a366b19c5770ec03612454ab2e2c
      MARCH_CORE_BACKEND: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - name: Build and verify the shared Web artifact
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RESPONSE_SHA^")" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" -- source game tools crates
          npm ci --prefix tools/web-runtime --ignore-scripts
          GITHUB_SHA="$SOURCE_SHA" python -B game/build_web.py --output build/web
          content=$(python -B tools/ci/gate.py artifact --root build/web --head "$SOURCE_SHA")
          printf 'WEB_CONTENT_SHA=%s\n' "$content" >> "$GITHUB_ENV"
          mkdir -p build/battle-poll-profile
          jq --arg run "$GITHUB_RUN_ID" --arg runner "$RUNNER_NAME" \
            '{commit,content_sha256,run_id:$run,runner:$runner}' \
            build/web/runtime/build.json > build/battle-poll-profile/web-identity.json
      - name: Desktop baseline
        run: bash .github/benchmarks/run-battle-step-variant.sh baseline desktop-chromium
      - name: Desktop response
        run: bash .github/benchmarks/run-battle-step-variant.sh response desktop-chromium
      - name: Touch response
        run: bash .github/benchmarks/run-battle-step-variant.sh response touch-chromium
      - name: Touch baseline
        run: bash .github/benchmarks/run-battle-step-variant.sh baseline touch-chromium
      - name: Verify the shared Web artifact and compare saved checkpoints
        run: |
          python -B tools/ci/gate.py artifact --root build/web --head "$SOURCE_SHA" --content-sha256 "$WEB_CONTENT_SHA"
          python -B .github/benchmarks/verify-battle-step-variant.py
      - name: Upload A/B raw timing and save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: battle-timeline-ab-${{ github.run_id }}
          path: build/battle-poll-profile/
          if-no-files-found: error
