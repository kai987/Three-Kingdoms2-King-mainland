name: Web campaign checks
run-name: ${{ inputs.trial }} save route batch ${{ inputs.batch_enabled && 'on' || 'off' }}

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Trial label
        type: string
        required: true
      batch_enabled:
        description: Batch route validation in save restores
        type: boolean
        required: true

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: ci-batch-restore-full-ab
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/codex/ci-batch-restore-full-ab'
    uses: ./.github/workflows/web-checks.yml
    with:
      batch_enabled: ${{ inputs.batch_enabled }}
