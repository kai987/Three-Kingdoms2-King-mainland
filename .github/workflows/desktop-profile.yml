name: Profile the pinned desktop shard
on:
  workflow_call:
    inputs:
      runner-label:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  FROZEN_SOURCE: e111fe57fb1d8fcf5402b1a214713fe899813fe0
  FROZEN_TREE: 70f6679607274d89c45d070d627dd802298cc31f
  FROZEN_WEB_CONTENT: 92f0e55555bb1c4d29159e04c0b5160b68d9f41012e570eba88412ffed0a5005
  TK2_TEST_PLAN: build/ci/test-plan.json
  PROFILE_SHARD: '2'
  SOURCE_RUN: '43871312515'
  BASELINE_WEB_ARTIFACT: '14228481595'

jobs:
  desktop-two:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Use the exact source commit for every measured case
        run: |
          test "$(git rev-parse HEAD^)" = "$FROZEN_SOURCE"
          git diff --exit-code "$FROZEN_SOURCE" HEAD -- . \
            ':(exclude).github/workflows/remake.yml' \
            ':(exclude).github/workflows/desktop-profile.yml' \
            ':(exclude).github/experiments/profile_desktop_shard.py'
          cp .github/experiments/profile_desktop_shard.py "$RUNNER_TEMP/profile_desktop_shard.py"
          git switch --detach "$FROZEN_SOURCE"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$FROZEN_TREE"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - name: Check the original candidate artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_WEB_ARTIFACT" \
            --jq '[.id,.name,.workflow_run.id,.digest,.expired]|@tsv' > "$RUNNER_TEMP/artifact.tsv"
          test "$(cut -f1 "$RUNNER_TEMP/artifact.tsv")" = "$BASELINE_WEB_ARTIFACT"
          test "$(cut -f2 "$RUNNER_TEMP/artifact.tsv")" = "candidate-web-$FROZEN_SOURCE"
          test "$(cut -f3 "$RUNNER_TEMP/artifact.tsv")" = "$SOURCE_RUN"
          test "$(cut -f4 "$RUNNER_TEMP/artifact.tsv")" = 'sha256:9bb740698d1f7c0bde217bdee4c5d9e7ff9b3ffbd1e04c525ac59eee20497341'
          test "$(cut -f5 "$RUNNER_TEMP/artifact.tsv")" = false
          cat "$RUNNER_TEMP/artifact.tsv"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-web-${{ env.FROZEN_SOURCE }}
          path: build/web
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ env.FROZEN_SOURCE }}
          path: build/ci
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-timing-desktop-chromium-shard-2-${{ env.FROZEN_SOURCE }}
          path: build/reference-timing
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
      - name: Verify Web contents and the original 17-case selection
        run: |
          python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
          mkdir -p build/desktop-profile
          cp "$RUNNER_TEMP/artifact.tsv" build/desktop-profile/
          node tools/browser-tests/scope.cjs --plan "$TK2_TEST_PLAN" > build/desktop-profile/browser-scope.json
          node tools/browser-tests/verify-shards.mjs desktop-chromium
          node <<'JS'
          const assert = require('node:assert/strict');
          const scope = require('./tools/browser-tests/scope.cjs').loadBrowserScope();
          const shard = require('./tools/browser-tests/case-shards.cjs').selectedShard(scope, 'desktop-chromium', 2);
          const reference = require('./build/reference-timing/desktop-chromium-shard-2.json');
          assert.equal(reference.commit, process.env.FROZEN_SOURCE);
          assert.equal(scope.full, true);
          assert.equal(scope.selectedCases.length, 50);
          assert.equal(shard.cases.length, 17);
          assert.deepEqual(shard.cases.map(c => c.id).sort(), reference.cases.map(c => c.id).sort());
          JS
          git hash-object tests/browser_ui.spec.mjs tests/browser_soldier_ui.spec.mjs tools/browser-tests/cases.json tools/browser-tests/case-durations.json
      - name: Repeat the desktop shard twice with runner telemetry
        run: DIAGNOSTIC_COMMIT="$GITHUB_SHA" GITHUB_SHA="$FROZEN_SOURCE" python -B "$RUNNER_TEMP/profile_desktop_shard.py"
      - name: Recheck unchanged Web contents after both repetitions
        run: python -B tools/ci/gate.py artifact --root build/web --head "$FROZEN_SOURCE" --content-sha256 "$FROZEN_WEB_CONTENT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-profile-${{ inputs.runner-label }}-attempt-${{ github.run_attempt }}
          path: build/desktop-profile
          if-no-files-found: error
          retention-days: 7
