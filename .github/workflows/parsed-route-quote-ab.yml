name: Parsed route quote cache A/B

on:
  push:
    branches: [codex/ci-parsed-route-quote-ab]
    paths: [.github/workflows/parsed-route-quote-ab.yml, tools/ci-experiments/profile_parsed_quotes.py]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      MARCH_CORE_BACKEND: rust
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout experimental harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: experiment
      - name: Checkout the exact #65 merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df2b51043bfccda36946c8c6d81bb68928eaefa4
          persist-credentials: false
          path: pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Verify and restore the native artifact produced by #65
        working-directory: pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse 'HEAD^{tree}')" = 59bfb6fa42703dc649d2de620910de661c43bbad
          mkdir -p build
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14758509901/zip" > build/native.zip
          echo 'c1abb9a68a8960e8299dd17a4488a750b5e6bb35dbdc77e8af807da9206255f5  build/native.zip' | sha256sum -c -
          unzip -p build/native.zip native-reference.tar | tar -xf - -C build
          echo '03e5c576409d43a2a2a3abc3f89ef9724fa60fc41bc9ebc184682bdc1fa0d1a9  build/march-core/libmarch_core.so' | sha256sum -c -
      - name: Record the shared runner
        run: |
          mkdir -p evidence
          lscpu > evidence/runner.txt
          uname -a >> evidence/runner.txt
          free -h >> evidence/runner.txt
          python --version >> evidence/runner.txt
      - name: Prove complete input equality, invalidation and caller isolation
        working-directory: pinned
        run: |
          for mode in check-baseline check-cached; do
            python -B ../experiment/tools/ci-experiments/profile_parsed_quotes.py "$mode" /dev/null
          done 2>&1 | tee ../evidence/cache-correctness.txt
      - name: 217 with the released cache
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_parsed_quotes.py baseline ../evidence/217-baseline.json --scenario 217
      - name: 263 with the parsed cache
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_parsed_quotes.py cached ../evidence/263-cached.json --scenario 263
      - name: 217 with the parsed cache
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_parsed_quotes.py cached ../evidence/217-cached.json --scenario 217
      - name: 263 with the released cache
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_parsed_quotes.py baseline ../evidence/263-baseline.json --scenario 263
      - name: Verify ordered views, saves, restored RNG and native call counts
        run: python -B experiment/tools/ci-experiments/profile_parsed_quotes.py compare evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: parsed-route-quote-ab
          path: evidence
          retention-days: 14
