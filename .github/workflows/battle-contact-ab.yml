name: Battle contact save-read A/B
on:
  push:
    branches: [codex/ci-battle-contact-ab-d93839a5]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, touch-chromium]
        case: [battle-movement, battle-layout]
    env:
      BASE_COMMIT: d93839a593c9e82f7cc602cd90e2bd5bb4a0aab9
      OPTIMIZED_COMMIT: 5a9200148bd9205eb52544d4c128868636a32c71
      RELEASE_RUN: 45974354993
      CONTENT_SHA: 53779480de04f294502ffe6a10a80bebb4ef080f97b6d9ec08217e8bdea59781
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - uses: ./.github/actions/browser-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          name: verified-candidate-${{ env.BASE_COMMIT }}-attempt-1
          run-id: ${{ env.RELEASE_RUN }}
          path: build/release-record
      - name: Prepare the exact Web candidate published by Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git diff --name-only "$BASE_COMMIT" "$OPTIMIZED_COMMIT")" = tests/browser_ui.spec.mjs
          git diff --exit-code "$BASE_COMMIT" HEAD -- game source crates tools/browser-tests .github/actions/browser-tools .github/workflows/web-checks.yml
          git diff --exit-code "$OPTIMIZED_COMMIT" HEAD -- tests/browser_ui.spec.mjs
          mkdir -p evidence
          lscpu > evidence/runner.txt
          git rev-parse "$BASE_COMMIT" "$OPTIMIZED_COMMIT" HEAD >> evidence/runner.txt
          python -B tools/ci/verified_web.py prepare --root build/web --record build/release-record/verified-candidate.json \
            --head "$BASE_COMMIT" --run-id "$RELEASE_RUN" --attempt 1 | tee evidence/verified-artifact.txt
      - name: Alternate old and new contact checks on the same runner
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_CASE: ${{ matrix.case }}
        run: python -B tools/ci-experiments/compare_battle_contact.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: battle-contact-${{ matrix.project }}-${{ matrix.case }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
