name: Deploy playable Web campaign

on:
  workflow_run:
    workflows: [Web campaign checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Manual publication uses the same gates. Pushes reuse the checked artifact.
  verify-manual:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      publish: true

  prepare:
    needs: verify-manual
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.verify-manual.result == 'success') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.identity.outputs.current }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.scope.outputs.publish }}
      artifact: ${{ steps.identity.outputs.artifact }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Require the successful main commit to still be current
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          SOURCE_RUN: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || github.run_id }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          printf 'commit=%s\nrun=%s\n' "$SOURCE_SHA" "$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          printf 'artifact=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_SHA" = "$current" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this superseded release will not deploy.'
          fi
      - name: Read the successful run's explicit publication decision
        if: steps.identity.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ steps.identity.outputs.commit }}
          path: verified-plan
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.run }}
      - name: Validate scope identity without executing project code
        if: steps.identity.outputs.current == 'true'
        id: scope
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.commit }}
        run: |
          python - <<'PYPLAN'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('verified-plan/test-plan.json').read_text())
          assert plan['schema'] == 'tk2-test-plan-v1'
          assert plan['head'] == os.environ['EXPECTED_SHA']
          assert type(plan['publish']) is bool and type(plan['docs_only']) is bool
          assert not (plan['docs_only'] and plan['publish'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(plan['publish']).lower() + '\n')
          print('Publication requested:', plan['publish'])
          PYPLAN
      - name: Download only the exact successful main run's tested static artifact
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-web-${{ steps.identity.outputs.commit }}
          path: verified-web
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.run }}
      - name: Verify identity without executing downloaded project code
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.commit }}
        run: |
          python - <<'PYVERIFY'
          import hashlib, json, os
          from pathlib import Path, PurePosixPath
          root = Path('verified-web')
          identity = json.loads((root / 'runtime/build.json').read_text())
          assert identity['schema'] == 'tk2-static-build-v1'
          assert identity['commit'] == os.environ['EXPECTED_SHA']
          files = identity['files']
          expected = set(files) | {'runtime/build.json'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, 'The release has missing or unexpected files'
          for name, record in files.items():
              relative = PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              target = root / relative
              assert not target.is_symlink()
              raw = target.read_bytes()
              assert len(raw) == record['bytes']
              assert hashlib.sha256(raw).hexdigest() == record['sha256']
          encoded = (json.dumps(files, ensure_ascii=False, allow_nan=False, separators=(',', ':')) + '\n').encode()
          assert hashlib.sha256(encoded).hexdigest() == identity['content_sha256']
          print('Verified the exact tested release:', identity['commit'])
          PYVERIFY
      - name: Upload verified Pages release
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: verified-web
      - name: Record the verified Pages archive checksum
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        id: archive
        run: |
          set -euo pipefail
          checksum=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    # Automatic releases intentionally skip the manual-verification ancestor.
    # Override the implicit success() check without deploying cancelled runs.
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' && needs.prepare.outputs.current == 'true' &&
      needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck main immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.commit }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_SHA"
      - name: Deploy verified artifact
        id: deployment
        # A failed-job rerun may reuse prepare's artifact from a previous attempt.
        if: needs.prepare.outputs.artifact == format('github-pages-{0}', github.run_attempt)
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.prepare.outputs.artifact }}
      - name: Allow Pages to settle before retrying with a fresh artifact
        id: retry_wait
        if: steps.deployment.outcome == 'failure' || steps.deployment.outcome == 'skipped'
        run: sleep 60
      - name: Download the verified Pages archive for retry
        if: steps.retry_wait.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/pages-retry
      - name: Require the retry archive to match the verified archive byte for byte
        if: steps.retry_wait.outcome == 'success'
        working-directory: ${{ runner.temp }}/pages-retry
        env:
          EXPECTED_SHA256: ${{ needs.prepare.outputs.archive_sha256 }}
        run: printf '%s  artifact.tar\n' "$EXPECTED_SHA256" | sha256sum -c -
      - name: Upload the same archive as a new Pages artifact
        if: steps.retry_wait.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-retry-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pages-retry/artifact.tar
          if-no-files-found: error
          retention-days: 1
      - name: Recheck main immediately before the retry
        if: steps.retry_wait.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.commit }}
        run: test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" = "$EXPECTED_SHA"
      - name: Deploy fresh verified artifact
        id: deployment_retry
        if: steps.retry_wait.outcome == 'success'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-retry-${{ github.run_attempt }}
