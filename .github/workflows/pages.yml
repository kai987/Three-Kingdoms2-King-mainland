name: Rehearse Pages preparation with verified Web artifacts
run-name: Pages prepare rehearsal (${{ inputs.variant }})

on:
  workflow_dispatch:
    inputs:
      ci_run:
        description: Successful experiment CI run ID
        required: true
        type: string
      variant:
        description: CI variant whose artifact should be fetched
        required: true
        type: choice
        options: [baseline, single-artifact, reuse]

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/codex/ci-gate-single-web-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/experiments/prepare-verified-web.py
            /tools/ci/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Fetch the artifact authorized by the successful gate and verify every file
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci_run }}
          VARIANT: ${{ inputs.variant }}
        run: python -B .github/experiments/prepare-verified-web.py "$CI_RUN" "$VARIANT"
      - name: Prepare the verified Pages archive
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: pages-rehearsal-${{ github.run_attempt }}
          path: verified-web
      - name: Record the Pages archive checksum
        run: sha256sum "$RUNNER_TEMP/artifact.tar" > pages-archive.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-prepare-evidence
          path: |
            prepare-evidence.json
            pages-archive.sha256
          if-no-files-found: error
