name: Rehearse PR 64 receipt reuse and Pages handoff

on:
  workflow_dispatch:
    inputs:
      tested_head:
        description: Exact temporary merge commit verified by PR 64
        type: string
        required: true
      pr_run:
        description: Successful PR 64 workflow run
        type: string
        required: true

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: pr64-pages-rehearsal
  cancel-in-progress: false

jobs:
  # Manual publication uses the same gates. Pushes reuse the checked artifact.
  verify-manual:
    if: github.ref == 'refs/heads/codex/rehearse-pr64-web-handoff'
    uses: ./.github/workflows/web-checks.yml
    with:
      force_full: true
      publish: true
      tested_head: ${{ inputs.tested_head }}
      pr_run: ${{ inputs.pr_run }}

  prepare:
    needs: verify-manual
    if: github.ref == 'refs/heads/codex/rehearse-pr64-web-handoff' && needs.verify-manual.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.identity.outputs.current }}
      commit: ${{ steps.identity.outputs.commit }}
      publish: ${{ steps.scope.outputs.publish }}
      artifact: ${{ steps.identity.outputs.artifact }}
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Require the successfully tested PR merge to still be current
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.tested_head }}
          SOURCE_RUN: ${{ github.run_id }}
          SOURCE_ATTEMPT: ${{ needs.verify-manual.outputs.verified_attempt }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/64" --jq .merge_commit_sha)
          printf 'commit=%s\nrun=%s\nattempt=%s\n' "$SOURCE_SHA" "$SOURCE_RUN" "$SOURCE_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'artifact=github-pages-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [ "$SOURCE_SHA" = "$current" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this superseded release will not deploy.'
          fi
      - name: Read the successful run's explicit publication decision
        if: steps.identity.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-plan-${{ steps.identity.outputs.commit }}
          path: verified-plan
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.run }}
      - name: Validate scope identity without executing project code
        if: steps.identity.outputs.current == 'true'
        id: scope
        env:
          EXPECTED_SHA: ${{ steps.identity.outputs.commit }}
        run: |
          python - <<'PYPLAN'
          import json, os
          from pathlib import Path
          plan = json.loads(Path('verified-plan/test-plan.json').read_text())
          assert plan['schema'] == 'tk2-test-plan-v1'
          assert plan['head'] == os.environ['EXPECTED_SHA']
          assert type(plan['publish']) is bool and type(plan['docs_only']) is bool
          assert not (plan['docs_only'] and plan['publish'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(plan['publish']).lower() + '\n')
          print('Publication requested:', plan['publish'])
          PYPLAN
      - name: Check out verification code from this Pages workflow revision
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: /tools/ci/
          sparse-checkout-cone-mode: false
      - name: Read the successful gate's verified candidate record
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-candidate-${{ steps.identity.outputs.commit }}-attempt-${{ steps.identity.outputs.attempt }}
          path: verified-candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.run }}
      - name: Download the recorded candidate and verify every release file
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.identity.outputs.commit }}
          SOURCE_RUN: ${{ steps.identity.outputs.run }}
          SOURCE_ATTEMPT: ${{ steps.identity.outputs.attempt }}
        run: |
          python -B tools/ci/verified_web.py prepare --root verified-web \
            --record verified-candidate/verified-candidate.json --head "$EXPECTED_SHA" \
            --run-id "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
      - name: Upload verified Pages release
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.identity.outputs.artifact }}
          path: verified-web
      - name: Record the verified Pages archive checksum
        if: steps.identity.outputs.current == 'true' && steps.scope.outputs.publish == 'true'
        id: archive
        run: |
          set -euo pipefail
          checksum=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          printf 'sha256=%s\n' "${checksum%% *}" >> "$GITHUB_OUTPUT"
      - name: Retain the rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-handoff-evidence
          path: |
            verified-candidate/verified-candidate.json
            verified-web/runtime/build.json
          if-no-files-found: error
