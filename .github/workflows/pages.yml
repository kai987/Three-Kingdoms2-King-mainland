name: Deploy playable Web campaign

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MARCH_CORE_BACKEND: python
      RUSTUP_TOOLCHAIN: '1.93.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/web-runtime/package-lock.json
      - name: Install integrity-pinned browser Python runtime
        run: npm ci --prefix tools/web-runtime --ignore-scripts
      - name: Prepare native reference for campaign parity tests
        run: |
          rustup toolchain install 1.93.0 --profile minimal --target wasm32-unknown-unknown
          python -B game/build_march_core.py --check
      - name: Campaign rules and static release boundaries
        run: python -m unittest discover -s tests -p 'test_remake_*.py' -v
      - name: Browser scripts and interaction checks
        run: |
          for file in game/*.js; do node --check "$file"; done
          for file in tests/test_remake_*.cjs; do node "$file"; done
          git diff --check
      - name: Build current immutable catalogs and approved public assets
        run: python -B game/build_web.py --output build/web
      - name: Real WebAssembly campaign and CPU replay parity
        run: node tests/browser_engine_smoke.mjs build/web
      - name: Upload Pages release
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
