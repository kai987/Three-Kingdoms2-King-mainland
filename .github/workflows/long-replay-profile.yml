name: Long replay Python profiling

on:
  push:
    branches: [codex/ci-long-replay-profile]
    paths: [.github/workflows/long-replay-profile.yml, tools/ci-experiments/profile_long_replay.py]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARCH_CORE_BACKEND: rust
      PYTHONHASHSEED: '0'
    steps:
      - name: Checkout profiling harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: experiment
      - name: Checkout #65 merge and its original replay cases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: df2b51043bfccda36946c8c6d81bb68928eaefa4
          persist-credentials: false
          path: pinned
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build the pinned native marching backend
        working-directory: pinned
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          cargo +1.93.0 build --manifest-path crates/march-core/Cargo.toml --target-dir build/march-core-target --locked --release --lib
          install -D build/march-core-target/release/libmarch_core.so build/march-core/libmarch_core.so
      - name: Record the shared runner
        run: |
          mkdir -p evidence
          lscpu > evidence/runner.txt
          uname -a >> evidence/runner.txt
          free -h >> evidence/runner.txt
      - name: Capture 217 reference checkpoints
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_long_replay.py reference ../evidence/217-reference.json --scenario 217
      - name: Profile 217 restore and full view
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_long_replay.py detailed ../evidence/217-detailed.json --scenario 217
      - name: Profile 263 restore and full view
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_long_replay.py detailed ../evidence/263-detailed.json --scenario 263
      - name: Capture 263 reference checkpoints
        working-directory: pinned
        run: python -B ../experiment/tools/ci-experiments/profile_long_replay.py reference ../evidence/263-reference.json --scenario 263
      - name: Verify identical ordered saves, restored RNG and full views
        run: python -B experiment/tools/ci-experiments/profile_long_replay.py compare evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: long-replay-python-profile
          path: evidence
          retention-days: 14
