<body>
  <header class="topbar">
    <div class="topbar-heading"><h1>三國·大陸戰役</h1><p id="date">選擇勢力</p></div>
    <nav aria-label="進度與規則">
      <button id="main-menu" aria-controls="inspector" aria-expanded="false" disabled><span class="nav-full">返回主選單</span><span class="nav-short" data-locale-only="zh-Hant" data-l10n-native="zh-Hant">主選單</span><span class="nav-short" data-locale-only="ja" data-l10n-native="ja" hidden>メニュー</span></button>

      <button id="load" disabled>讀取進度</button>
      <button id="cloud-save" disabled>雲端存檔</button>

        <summary><span data-locale-only="zh-Hant" data-l10n-native="zh-Hant">更多</span><span data-locale-only="ja" data-l10n-native="ja" hidden>その他</span></summary>
        <div class="utility-panel">

          <button id="event-history" aria-controls="event-dialog" disabled>事件回顧</button>
          <button id="rules">規則說明</button>
          <button id="audio-settings" aria-controls="dialog">音樂設定</button>
        </div>
      </details>
    </nav>
  </header>
  <p id="notice" role="status" aria-live="polite"></p>
  <main>
    <div class="game-layout">
    <section id="stage" aria-label="戰役地圖"></section>
    <aside id="inspector" aria-label="目前操作"><p>正在準備戰役……</p></aside>
    <section class="journal" aria-labelledby="journal-title">
      <div class="journal-heading"><h2 id="journal-title">戰報</h2><button id="restart">重開戰役</button></div>
      <ol id="journal"><li>選擇勢力後開始。</li></ol>
    </section>
    </div>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="event-dialog" aria-labelledby="event-title" aria-describedby="event-description"></dialog>
