<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三國·大陸戰役</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/cloud-save.css">
  <link rel="stylesheet" href="/portraits.css">
  <script src="/i18n.js" defer></script>
  <script src="/map-navigation.js" defer></script>
  <script src="/march-core.js" defer></script>
  <script src="/save-transfer.js" defer></script>
  <script src="/vendor/supabase.min.js" defer></script>
  <script src="/cloud-save.js" defer></script>
  <script src="/cloud-save-ui.js" defer></script>
  <script src="/portraits.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1>三國·大陸戰役</h1>
    <p id="date">選擇勢力</p>
    <nav aria-label="進度與規則">
      <label class="language-picker">語言<select id="language" aria-label="切換語言"><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option></select></label>
      <button id="main-menu" aria-controls="inspector" aria-expanded="false" disabled>返回主選單</button>
      <button id="save" disabled>儲存進度</button>
      <button id="load">讀取進度</button>
      <button id="cloud-save" disabled>雲端存檔</button>
      <button id="rules">規則說明</button>
      <button id="library">人物庫</button>
    </nav>
  </header>
  <p id="notice" role="status" aria-live="polite"></p>
  <main>
    <section id="stage" aria-label="戰役地圖"></section>
    <aside id="inspector" aria-label="目前操作"><p>正在準備戰役……</p></aside>
    <section class="journal" aria-labelledby="journal-title">
      <div class="journal-heading"><h2 id="journal-title">戰報</h2><button id="restart">重開戰役</button></div>
      <ol id="journal"><li>選擇勢力後開始。</li></ol>
    </section>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <noscript>請啟用瀏覽器JavaScript後開始戰役。</noscript>
</body>
</html>
